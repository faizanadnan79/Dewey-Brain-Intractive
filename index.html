<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dewey Brain Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A3D7C;
            --accent: #00C9FF;
            --secondary: #5C5FE9;
            --success: #00B37E;
            --warning: #FFC947;
            --error: #FF4B5C;
            --bg-light: #F7F9FC;
            --panel-light: #FFFFFF;
            --text-light: #1E1E2F;
            --text-light-muted: #5a647e;
            --border-light: #e0e6f1;
            --footer-bg-light: #F0F4FA;
            --bg-dark: #0E1525;
            --panel-dark: #1C2235;
            --text-dark: #E8EBF0;
            --text-dark-muted: #8a94a6;
            --border-dark: #30384c;
            --footer-bg-dark: #0A0F1A;
        }

        body, header, footer, .modal-content {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        .dark body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }
        
        html[lang="ur"] body, html[lang="ar"] body {
            font-family: 'Noto Naskh Arabic', serif;
        }

        .loader {
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark .loader {
             border: 4px solid var(--border-dark);
             border-top-color: var(--accent);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeInAnimation 0.5s ease-out forwards;
        }
        @keyframes fadeInAnimation { 
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); } 
        }

        .quiz-option.correct {
            border-color: var(--success);
            background-color: rgba(0,179,126,0.1);
        }
        .quiz-option.incorrect {
            border-color: var(--error);
            background-color: rgba(255,75,92,0.1);
        }
        
        /* Intro Splash Screen */
        #intro-splash {
            background: linear-gradient(135deg, #0E1525, #004d40, #00c9ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .intro-logo {
            animation: logo-bounce-in 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }
        
        #intro-title {
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            position: relative;
            overflow: hidden; /* To contain the shimmer */
        }
        
        #intro-title::after {
            content: '';
            position: absolute;
            top: -10%; left: -150%;
            width: 200%; height: 120%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(20deg);
            animation: shimmer 4s infinite 1.5s;
        }

        .intro-text {
            opacity: 0;
            background: linear-gradient(90deg, #00c9ff, #00b37e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            animation: fade-in 1s ease-out 0.5s forwards;
        }

        .intro-progress-bar-container {
             background-color: rgba(255,255,255,0.2);
             border-radius: 2px;
             padding: 2px;
        }

        .intro-progress-bar {
            height: 4px;
            background-color: #00c9ff;
            border-radius: 2px;
            width: 0%;
            animation: progress-load 3s ease-in-out 1s forwards;
        }

        #intro-splash.fade-out {
            animation: fade-out 0.5s ease-in forwards;
        }

        @keyframes logo-bounce-in {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            40% { left: 150%; }
            100% { left: 150%; }
        }
        
        @keyframes progress-load {
            from { width: 0%; }
            to { width: 100%; }
        }

        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Language Dropdown */
        .language-dropdown {
            origin-top-right: right;
            transform-origin: top right;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }
        .language-dropdown.hidden {
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0"
  }
}
</script>
</head>
<body class="antialiased">
    <div id="root"></div>
</body>
</html>
